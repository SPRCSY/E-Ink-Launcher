name: Android CI

on:
  push:
    branches: [ "v0.x" ]
  pull_request:
    branches: [ "v0.x" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_CMB_STORE_PASSWORD: ${{ secrets.CMB_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_CMB_KEY_PASSWORD: ${{ secrets.CMB_KEY_PASSWORD }}
    
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleRelease
